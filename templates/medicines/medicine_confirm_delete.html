{% extends 'base.html' %}

{% block title %}Delete Medicine - Medicine Tracker{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card">
        <h2 style="color: var(--danger-color);">Delete Medicine</h2>
        <p style="margin-bottom: 2rem;">
            Are you sure you want to delete <strong>{{ medicine.name }}</strong>? This action cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions" style="justify-content: flex-end;">
                <a href="{% url 'medicine_list' %}" class="btn btn-text">Cancel</a>
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
